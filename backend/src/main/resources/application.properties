# SkillSift Application Configuration
spring.application.name=backend

# Server
server.port=${PORT:8080}

# Database Configuration (Defaults to embedded H2 if DB_URL not provided, or PostgreSQL when configured)
spring.datasource.url=${DB_URL:jdbc:h2:mem:skillsiftdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console (enabled for local testing)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security & JWT
jwt.secret=${JWT_SECRET:SkillSiftSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLongAndSecure2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# External API Keys (backend-only)
youtube.api.key=${YOUTUBE_API_KEY:}
groq.api.key=${GROQ_API_KEY:}
